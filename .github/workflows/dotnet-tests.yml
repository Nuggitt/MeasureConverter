name: .NET Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MeasureConverter.slnx

      - name: Build
        run: dotnet build MeasureConverter.slnx --no-restore

      - name: Run tests
        env:
          CURRENCY_API_KEY: ${{ secrets.CURRENCY_API_KEY }}
        run: dotnet test MeasureConverter.slnx --no-build --verbosity normal
